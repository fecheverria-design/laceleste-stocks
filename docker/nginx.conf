server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El TLS lo termina Cloudflare (el entrypoint de Traefik es `web`, plano :80).
    # Acá solo hablamos HTTP; los headers reales del visitante llegan por X-Forwarded-*.
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API, al mismo origen que el front → sin CORS. Mantiene el prefijo /api,
    # que es como están montadas las rutas de Express.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Los assets con hash en el nombre son inmutables: se pueden cachear para siempre.
    # Un solo add_header y sin `expires`: los dos juntos mandan Cache-Control duplicado.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # SPA (React Router): cualquier ruta que no sea un archivo real cae en index.html,
    # si no un F5 en /movimientos daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index NO se cachea, si no un deploy nuevo no lo ve nadie hasta que expire.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
